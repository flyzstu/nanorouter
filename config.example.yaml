listen: ":8080"
database:
  driver: sqlite
  dsn: "./nanorouter.db"
  # 高 QPS 时可异步批量写账本；队列满或进程崩溃可能丢失尚未落盘的记录。
  async_write: false
  batch_size: 100
  flush_interval: 100ms
  queue_size: 4096
# 默认输出带颜色的 key=value 文本；采集系统需要 JSON 时设置 format: json。
logging:
  language: zh-CN
  level: INFO
  format: text
  color: true
# 日志时区通过进程环境变量 TZ 控制，例如 TZ=Asia/Shanghai；数据库时间始终保存为 UTC。
# 设定后，下游需使用 Authorization: Bearer $NANOROUTER_API_KEY。
auth_env: NANOROUTER_API_KEY
# 公开统计面：/stats、/v1/stats/summary、/v1/zcode/usage 不再要求 key，
# 供内网或反代层已做访问控制的部署直接打开面板。注意 /v1/zcode/usage 会
# 匿名触发网关用所存凭据外呼智谱监控端点，并暴露配额/积分等账户级数据；
# 生成端点不受影响，照常要求 key。默认 false。
# stats_public: true
# 统计页的调用方 IP 取自 X-Forwarded-For 首值。仅当网关前面有可信反代时
# 开启；直连部署保持关闭（默认 false，记录 TCP 对端地址），否则调用方可
# 伪造来源。
# trust_forwarded_for: true
# 信任边缘反代注入的身份头：SSO（如 Traefik + Authelia forwardAuth）放行的
# 请求携带非空该头时，浏览器面（/stats、/v1/stats/summary、/v1/zcode/usage、
# /v1/zcode/reset/status、/v1/api-keys）免 key 直接访问，不再弹 Basic 登录框。
# 生成端点、核销（/v1/zcode/reset/use）与 /metrics 不在放行面内，照常要求 key。
# 仅限可信反代后开启：头名必须由反代覆盖写入（authResponseHeaders），否则
# 客户端可伪造该头直连网关端口绕过 SSO。默认空（关闭）。
# proxy_auth:
#   header: Remote-User
# ZCode 额度重置卡：查询（GET /v1/zcode/reset/status）恒可用；核销
# （POST /v1/zcode/reset/use）默认关闭。核销会不可逆地消耗一张卡，网关又是
# 无人值守服务，请确认实例只有可信调用方后再打开。请求主链路不会自动核销。
zcode_reset:
  allow_use: false
  # 让 reset 端点在网关层跳过 auth_env 鉴权，交给反代（如 Traefik + Authelia）。
  # 与 stats_public 刻意分开：统计面公开不等于允许匿名花卡。开启时必须让反代
  # 强制 /v1/zcode/reset 经过身份验证，且不能让「带认证头即绕过反代」的规则
  # 覆盖它们，否则等于公开核销。默认 false。
  # public: true
# 页面创建的 API Key。enabled 打开后，生成端点必须携带业务 Key；业务 Key
# 只放行生成端点，不能访问统计、用量、重置卡、metrics 和 Key 管理。
# manage_public 让 /v1/api-keys 在网关层跳过鉴权，交给反代（如 Traefik +
# Authelia）承担管理授权；开启时必须强制 /v1/api-keys 经过边缘身份验证，
# 并阻止「携带认证头即绕过反代」的规则覆盖它。
api_keys:
  enabled: false
  manage_public: false
request_timeout: 90s
# 全局覆盖转发到上游的 User-Agent。默认 Go-http-client/x.x 会被部分上游
# （如 Nous Research 的 Cloudflare WAF）拦截并返回 403；可设为常规客户端 UA，
# 例如 opencode/1.18.25。单个候选也可用 user_agent 覆盖此全局值。
# user_agent: opencode/1.18.25
# 429 会先切换其他候选；全部限流后按等抖动指数退避重试。
retry:
  max_rate_limit_retries: 5
  base_delay: 1s
  max_delay: 16s
# 进程级准入在读取请求体之前生效；满载后只允许有限请求短暂排队。
backpressure:
  max_inflight: 512
  max_queue: 128
  queue_timeout: 1s
# 默认关闭。开启后 /debug/pprof/* 与其他端点使用相同的 Bearer 鉴权。
profiling:
  enabled: false
# 熔断后后台异步探活（Ping-Pong Prober）：仅在候选因 503/网络错误熔断后触发，
# 冷却期满时代替真实用户发极简 Ping 验证存活，健康期内零心跳、零额度消耗。
# 全局默认关闭，推荐在不稳定的免费模型候选上单独设置 probe: true。
health_check:
  enabled: false
  probe_timeout: 5s
  interval: 2s
  max_backoff: 10m

routes:
  # llama-server 使用服务根地址即可；llama_server: true 会自动补上 /v1。
  # 启动示例：llama-server -m ./model.gguf --alias local-llama --port 8081
  # 未传 --api-key 时，不设置 api_key_env，网关不会发送 Authorization。
  local-llama:
    strategy: weighted_round_robin
    candidates:
      - id: llama-server-local
        base_url: http://127.0.0.1:8081
        model: local-llama
        llama_server: true
        enabled: true
        # 同时只向本地模型发送一个请求；其余请求最多排队 30 秒，随后返回 429。
        max_concurrency: 1
        queue_timeout: 30s
        # 单次上游调用（包括完整 SSE）的截止时间；0 表示仅使用全局 request_timeout。
        attempt_timeout: 60s
        # 可选 AIMD：从 min_concurrency 起步，在 max_concurrency 内动态调整。
        adaptive_concurrency: false
        min_concurrency: 1
        target_ttfb: 2s
        # llama-server 各版本均支持 Chat Completions；Responses 请求走受限适配。
        responses_via_chat_completions: true
        # 其他上游思考模型可能在对话历史中包含 reasoning_content，llama-server 不支持该字段。
        drop_message_fields:
          - reasoning_content

  # 智谱 AI Coding Plan：专属编码套餐路由，全面模拟 OpenCode 客户端行为。
  # 自动设置 User-Agent: opencode/1.18.30，注入 thinking 与流式 include_usage，
  # 补全 X-Session-Affinity/X-Session-Id，并保留 reasoning_content 保持推理连贯。
  # 下游可访问 /v1/chat/completions (model: zhipuaicoding) 或专属端点 /zhipu-aicoding 与 /zhipuaicoding。
  zhipuaicoding:
    strategy: weighted_round_robin
    candidates:
      - id: zhipuaicoding-glm-5-3
        base_url: https://open.bigmodel.cn/api/coding/paas/v4
        api_key_env: ZHIPU_API_KEY
        model: glm-5.3
        expose_as: glm-5.3
        simulate_opencode: true
        enabled: true
        responses_via_chat_completions: true
        attempt_timeout: 90s
        drop_request_fields:
          - promptCacheKey
          - prompt_cache_key
      - id: zhipuaicoding-glm-5-3-flash
        base_url: https://open.bigmodel.cn/api/coding/paas/v4
        api_key_env: ZHIPU_API_KEY
        model: glm-5.3-flash
        expose_as: glm-5.3-flash
        simulate_opencode: true
        aggregate_enabled: false
        enabled: true
        responses_via_chat_completions: true
        attempt_timeout: 90s
        drop_request_fields:
          - promptCacheKey
          - prompt_cache_key

  # OpenCode Go：低成本的编程模型订阅服务，在 opencode.ai/auth 订阅并复制 API 密钥。
  # 多数模型走 OpenAI 兼容的 chat/completions；gpt-5.6-luna 使用原生 /responses。
  # MiniMax、Qwen 等只暴露 Anthropic /v1/messages 的模型无法接入本网关。
  opencode-go:
    strategy: weighted_round_robin
    candidates:
      - id: opencode-go-deepseek-v4-flash
        base_url: https://opencode.ai/zen/go/v1
        api_key_env: OPENCODE_GO_API_KEY
        model: deepseek-v4-flash
        expose_as: opencode-go-deepseek-v4-flash
        weight: 3
        enabled: true
      - id: opencode-go-deepseek-v4-pro
        base_url: https://opencode.ai/zen/go/v1
        api_key_env: OPENCODE_GO_API_KEY
        model: deepseek-v4-pro
        expose_as: opencode-go-deepseek-v4-pro
        weight: 1
        enabled: true
      - id: opencode-go-kimi-k2-7-code
        base_url: https://opencode.ai/zen/go/v1
        api_key_env: OPENCODE_GO_API_KEY
        model: kimi-k2.7-code
        expose_as: opencode-go-kimi-k2-7-code
        weight: 1
        enabled: true
      # gpt-5.6-luna 是唯一通过原生 /v1/responses 提供的模型，需声明 responses: true。
      - id: opencode-go-gpt-5-6-luna
        base_url: https://opencode.ai/zen/go/v1
        api_key_env: OPENCODE_GO_API_KEY
        model: gpt-5.6-luna
        expose_as: opencode-go-gpt-5-6-luna
        weight: 1
        enabled: true
        responses: true

  free-fast:
    strategy: weighted_round_robin
    # 正常请求补充 10% 重试令牌；额外上游调用消耗一个，最多积累 10 个。
    retry_budget:
      enabled: true
      ratio: 0.1
      burst: 10
    candidates:
      - id: openrouter-deepseek
        base_url: https://openrouter.ai/api/v1
        api_key_env: OPENROUTER_API_KEY
        model: "<OpenRouter 实际模型 ID>"
        expose_as: openrouter-deepseek
        weight: 3
        responses: true
        enabled: true
        attempt_timeout: 5s
        # 针对容易 503 的免费模型开启熔断后后台 Ping-Pong 探活，避免真实用户探雷。
        probe: true
        # 候选级配置覆盖全局 retry；expose_as 入口只重试自身。
        retry:
          max_retries: 5
          base_delay: 2s
          max_delay: 30s
      - id: groq-qwen
        base_url: https://api.groq.com/openai/v1
        api_key_env: GROQ_API_KEY
        model: "<Groq 当前可用模型 ID>"
        expose_as: groq-qwen
        weight: 1
        responses: true
        enabled: true
        # Groq 原生支持 /chat/completions 与 /responses，直接透传。
        # 根据 Groq 文档，以下字段会导致 Chat Completions 400 或尚不支持。
        # reasoning_effort 为 token.sensenova.cn 特有字段，Groq 不支持。
        drop_request_fields:
          - logprobs
          - logit_bias
          - top_logprobs
          - metadata
          - store
          - reasoning_effort
        # reasoning_content 是 DeepSeek 思考模式在 assistant 消息中添加的字段，
        # 其他上游不支持该字段且会返回 422。
        drop_message_fields:
          - name
          - reasoning_content

      # SenseNova 6.7 Flash-Lite：标准 OpenAI Chat Completions 接口，
      # 支持图像输入（image_url）、工具调用、并行工具调用与 reasoning_effort。
      - id: sensenova-flash-lite
        base_url: https://token.sensenova.cn/v1
        api_key_env: SENSENOVA_API_KEY
        model: sensenova-6.7-flash-lite
        expose_as: sensenova-flash-lite
        weight: 1
        enabled: true
        responses_via_chat_completions: true
        retry:
          max_retries: 2
          base_delay: 500ms
          max_delay: 4s
        # SenseNova 要求最大输出 token 位于 [1, 65536]；过大或为 0 时按候选独立调整。
        max_tokens_limit: 65536

      # DeepSeek V4 Flash：与 Flash-Lite 共享端点与认证，默认启用思考模式。
      # reasoning_content 字段在思考模式下随响应透传给下游，无需网关处理。
      - id: sensenova-deepseek-v4-flash
        base_url: https://token.sensenova.cn/v1
        api_key_env: SENSENOVA_API_KEY
        model: deepseek-v4-flash
        expose_as: deepseek-v4-flash
        weight: 1
        enabled: true
        responses_via_chat_completions: true
        max_tokens_limit: 65536

      # Agnes 2.0 Flash 只公开 Chat Completions；对下游 Responses 请求使用适配器。
      - id: agnes-flash
        base_url: https://apihub.agnes-ai.com/v1
        api_key_env: AGNES_API_KEY
        model: agnes-2.0-flash
        expose_as: agnes-flash
        weight: 1
        responses_via_chat_completions: true
        enabled: true
        max_tokens_limit: 65536
        # reasoning_effort 为 token.sensenova.cn 特有字段，Agnes 不支持。
        drop_request_fields:
          - reasoning_effort
        drop_message_fields:
          - reasoning_content

      # Mistral Medium 3.5 原生支持 Chat Completions；Responses 通过适配器提供。
      - id: mistral-medium-3-5
        base_url: https://api.mistral.ai/v1
        api_key_env: MISTRAL_API_KEY
        model: mistral-medium-3-5
        expose_as: mistral-medium-3-5
        weight: 1
        responses_via_chat_completions: true
        enabled: true
        drop_request_fields:
          - reasoning_effort
        drop_message_fields:
          - reasoning_content

      # Cerebras 的 gpt-oss-120b 原生支持 Chat Completions；Responses 使用适配器。
      - id: cerebras-gpt-oss-120b
        base_url: https://api.cerebras.ai/v1
        api_key_env: CEREBRAS_API_KEY
        model: gpt-oss-120b
        expose_as: cerebras-gpt-oss-120b
        weight: 1
        responses_via_chat_completions: true
        enabled: true
        drop_request_fields:
          - reasoning_effort
        drop_message_fields:
          - reasoning_content

      # Nous Research Hermes 4.3 36B 只提供 Chat Completions；Responses 通过适配器提供。
      - id: nous-hermes-4-3-36b
        base_url: https://inference-api.nousresearch.com/v1
        api_key_env: NOUS_API_KEY
        model: Hermes-4.3-36B
        expose_as: hermes-4.3-36b
        weight: 1
        enabled: true
        responses_via_chat_completions: true
        # 部分上游（如 Nous Research 的 Cloudflare WAF）会拦截 Go 客户端默认的
        # Go-http-client/x.x User-Agent。遇到 403 时可用常规客户端 UA 覆盖，例如：
        # user_agent: opencode/1.18.25

# ─────────────────────────────────────────────────────────────────────────────
# ZCode Coding Plan（Anthropic Messages 网关）上游。
#
# 下游是 Anthropic 协议客户端（Claude Code、dsh 等）时，Base URL 指向网关的
# /v1，直接请求 /v1/messages；下游是 OpenAI 协议客户端时，继续用
# /v1/chat/completions，网关自动做 Chat↔Messages 双向翻译。
#
# 首次使用先执行 `nanorouter login zcode --channel bigmodel` 完成设备码登录，
# 凭据写入 ~/.nanorouter/zcode_token.json；候选开启 zcode_token_file 后即可
# 免环境变量读取。也可以直接用 ZCODE_API_KEY 环境变量传入 id.secret 形式的 key。
#
# 网关运行中也能发起登录（省去登录宿主机这一步），凭据落盘后热加载、无需重启：
#   POST /zcode/login[?channel=zai]  发起并返回 auth_url（202），链接同时进日志
#   GET  /zcode/login                轮询进度：idle/awaiting_authorization/exchanging/succeeded/failed
# 两者都需要 Authorization: Bearer $NANOROUTER_API_KEY。
# 容器部署时 ~/.nanorouter/ 需可写——根文件系统只读时把 HOME 指向 emptyDir。
  zcode:
    strategy: weighted_round_robin
    candidates:
      - id: zcode-bigmodel
        base_url: https://zcode.z.ai
        model: GLM-5.3
        anthropic: true
        simulate_zcode: true        # ZCode 桌面客户端指纹：UA、CLI 身份头、双凭据头、会话 id 派生
        zcode_channel: bigmodel     # bigmodel（ultra 路径）或 zai（ultra-zai 路径）
        # anthropic_messages_path: api/v1/ultra/anthropic/v1/messages
        # ↑ 上游路径显式覆盖；默认按渠道取网关路径，通用 Anthropic 上游为 v1/messages
        zcode_token_file: true      # 环境变量未命中时回退读取凭据文件
        weight: 3
      - id: zcode-bigmodel-flash
        base_url: https://zcode.z.ai
        model: GLM-5.3-Flash
        anthropic: true
        simulate_zcode: true
        zcode_channel: bigmodel
        zcode_token_file: true
        weight: 1
