listen: ":8080"
database:
  driver: sqlite
  dsn: "./nanorouter.db"
# 默认输出带颜色的 key=value 文本；采集系统需要 JSON 时设置 format: json。
logging:
  language: zh-CN
  level: INFO
  format: text
  color: true
# 日志时区通过进程环境变量 TZ 控制，例如 TZ=Asia/Shanghai；数据库时间始终保存为 UTC。
# 设定后，下游需使用 Authorization: Bearer $NANOROUTER_API_KEY。
auth_env: NANOROUTER_API_KEY
request_timeout: 90s

routes:
  # llama-server 使用服务根地址即可；llama_server: true 会自动补上 /v1。
  # 启动示例：llama-server -m ./model.gguf --alias local-llama --port 8081
  # 未传 --api-key 时，不设置 api_key_env，网关不会发送 Authorization。
  local-llama:
    strategy: weighted_round_robin
    candidates:
      - id: llama-server-local
        base_url: http://127.0.0.1:8081
        model: local-llama
        llama_server: true
        enabled: true
        # 同时只向本地模型发送一个请求；其余请求最多排队 30 秒，随后返回 429。
        max_concurrency: 1
        queue_timeout: 30s
        # llama-server 各版本均支持 Chat Completions；Responses 请求走受限适配。
        responses_via_chat_completions: true
        # 其他上游思考模型可能在对话历史中包含 reasoning_content，llama-server 不支持该字段。
        drop_message_fields:
          - reasoning_content

  # 智谱通用 API 只提供 Chat Completions；需要 Responses 的下游请求会使用
  # 受限的 Responses→Chat 适配。Coding 套餐请改用智谱专属 coding 端点。
  zhipu-agent:
    strategy: weighted_round_robin
    candidates:
      - id: zhipu-glm
        base_url: https://open.bigmodel.cn/api/paas/v4
        api_key_env: ZHIPUAI_API_KEY
        model: "<智谱实际模型 ID，例如 glm-5.1>"
        responses_via_chat_completions: true
        enabled: true
        # OpenCode 的 OpenAI SDK 会注入此缓存路由参数；智谱使用自动上下文缓存，
        # 因此在其不支持该扩展字段时由网关删除，避免 400。
        drop_request_fields:
          - promptCacheKey
          - prompt_cache_key
        drop_message_fields:
          - reasoning_content

  free-fast:
    strategy: weighted_round_robin
    candidates:
      # 保留 zhipu-agent 作为固定智谱路由；这里额外纳入 free-fast，
      # 让聚合路由可按权重选择智谱，并在其他上游失败时切换到它。
      - id: zhipu-glm-free-fast
        base_url: https://open.bigmodel.cn/api/paas/v4
        api_key_env: ZHIPUAI_API_KEY
        model: "<智谱实际模型 ID，例如 glm-5.1>"
        expose_as: zhipu-glm
        weight: 1
        responses_via_chat_completions: true
        enabled: true
        # 智谱使用自动上下文缓存，不支持 OpenCode 注入的此扩展字段。
        drop_request_fields:
          - promptCacheKey
          - prompt_cache_key
        drop_message_fields:
          - reasoning_content
      - id: openrouter-deepseek
        base_url: https://openrouter.ai/api/v1
        api_key_env: OPENROUTER_API_KEY
        model: "<OpenRouter 实际模型 ID>"
        expose_as: openrouter-deepseek
        weight: 3
        responses: true
        enabled: true
      - id: groq-qwen
        base_url: https://api.groq.com/openai/v1
        api_key_env: GROQ_API_KEY
        model: "<Groq 当前可用模型 ID>"
        expose_as: groq-qwen
        weight: 1
        responses: true
        enabled: true
        # Groq 原生支持 /chat/completions 与 /responses，直接透传。
        # 根据 Groq 文档，以下字段会导致 Chat Completions 400 或尚不支持。
        # reasoning_effort 为 token.sensenova.cn 特有字段，Groq 不支持。
        drop_request_fields:
          - logprobs
          - logit_bias
          - top_logprobs
          - metadata
          - store
          - reasoning_effort
        # reasoning_content 是 DeepSeek 思考模式在 assistant 消息中添加的字段，
        # 其他上游不支持该字段且会返回 422。
        drop_message_fields:
          - name
          - reasoning_content

      # SenseNova 6.7 Flash-Lite：标准 OpenAI Chat Completions 接口，
      # 支持图像输入（image_url）、工具调用、并行工具调用与 reasoning_effort。
      - id: sensenova-flash-lite
        base_url: https://token.sensenova.cn/v1
        api_key_env: SENSENOVA_API_KEY
        model: sensenova-6.7-flash-lite
        expose_as: sensenova-flash-lite
        weight: 1
        enabled: true
        responses_via_chat_completions: true
        # SenseNova 要求最大输出 token 位于 [1, 65536]；过大或为 0 时按候选独立调整。
        max_tokens_limit: 65536

      # DeepSeek V4 Flash：与 Flash-Lite 共享端点与认证，默认启用思考模式。
      # reasoning_content 字段在思考模式下随响应透传给下游，无需网关处理。
      - id: sensenova-deepseek-v4-flash
        base_url: https://token.sensenova.cn/v1
        api_key_env: SENSENOVA_API_KEY
        model: deepseek-v4-flash
        expose_as: deepseek-v4-flash
        weight: 1
        enabled: true
        responses_via_chat_completions: true
        max_tokens_limit: 65536

      # Agnes 2.0 Flash 只公开 Chat Completions；对下游 Responses 请求使用适配器。
      - id: agnes-flash
        base_url: https://apihub.agnes-ai.com/v1
        api_key_env: AGNES_API_KEY
        model: agnes-2.0-flash
        expose_as: agnes-flash
        weight: 1
        responses_via_chat_completions: true
        enabled: true
        # reasoning_effort 为 token.sensenova.cn 特有字段，Agnes 不支持。
        drop_request_fields:
          - reasoning_effort
        drop_message_fields:
          - reasoning_content

      # Mistral Medium 3.5 原生支持 Chat Completions；Responses 通过适配器提供。
      - id: mistral-medium-3-5
        base_url: https://api.mistral.ai/v1
        api_key_env: MISTRAL_API_KEY
        model: mistral-medium-3-5
        expose_as: mistral-medium-3-5
        weight: 1
        responses_via_chat_completions: true
        enabled: true
        drop_request_fields:
          - reasoning_effort
        drop_message_fields:
          - reasoning_content

      # Cerebras 的 gpt-oss-120b 原生支持 Chat Completions；Responses 使用适配器。
      - id: cerebras-gpt-oss-120b
        base_url: https://api.cerebras.ai/v1
        api_key_env: CEREBRAS_API_KEY
        model: gpt-oss-120b
        expose_as: cerebras-gpt-oss-120b
        weight: 1
        responses_via_chat_completions: true
        enabled: true
        drop_request_fields:
          - reasoning_effort
        drop_message_fields:
          - reasoning_content
