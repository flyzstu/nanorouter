name: Build container image

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nanorouter_test
    env:
      # job 容器内通过 service id 访问；不要用 127.0.0.1。
      NANOROUTER_TEST_POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/nanorouter_test?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Unit and PostgreSQL tests
        run: go test ./... -count=1

      - name: Race tests
        run: go test -race ./internal/router -run 'APIKey|Auth' -count=1

      - name: API key smoke (SQLite)
        run: ./scripts/api-keys-smoke.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      REGISTRY: coding.fly97.fun:8443
      IMAGE: coding.fly97.fun:8443/fly97/nanorouter
      IMAGE_TAG: ${{ gitea.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build image
        env:
          VERSION: ${{ gitea.ref_name }}
        run: docker build --pull --build-arg VERSION="$VERSION" --tag "$IMAGE:$IMAGE_TAG" .

      - name: Log in to Gitea container registry
        if: gitea.event_name == 'push' || gitea.event_name == 'workflow_dispatch'
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin

      - name: Push image tags
        if: gitea.event_name == 'push' || gitea.event_name == 'workflow_dispatch'
        env:
          REF: ${{ gitea.ref }}
          REF_NAME: ${{ gitea.ref_name }}
        run: |
          # 始终推 commit sha，便于回溯。
          docker push "$IMAGE:$IMAGE_TAG"
          if [[ "$REF" == refs/tags/* ]]; then
            # tag 构建：推指定版本号，并把 latest 指向最新正式版本。
            TAG="${REF_NAME//\//-}"
            docker tag "$IMAGE:$IMAGE_TAG" "$IMAGE:$TAG"
            docker tag "$IMAGE:$IMAGE_TAG" "$IMAGE:latest"
            docker push "$IMAGE:$TAG"
            docker push "$IMAGE:latest"
          elif [[ "$REF" == refs/heads/main ]]; then
            # main 构建：推 main 作为滚动开发镜像，不动 latest。
            docker tag "$IMAGE:$IMAGE_TAG" "$IMAGE:main"
            docker push "$IMAGE:main"
          fi
